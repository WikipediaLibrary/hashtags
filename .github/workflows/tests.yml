name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create env file
        run: cp template.env .env

      - name: Run tests
        run: >
          docker compose run --rm --build migrate
          python manage.py test --noinput
